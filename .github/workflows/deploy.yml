name: Deploy Hotel API

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, hotel-vm]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Build and start the app
        run: docker compose up -d --build --remove-orphans

      - name: Confirm container status
        run: docker compose ps
