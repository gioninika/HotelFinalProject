name: hotels-management

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HotelDevPassword2026!"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  hotel:
    build:
      context: .
      dockerfile: Hotel/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HotelsManagementDb;User Id=sa;Password=HotelDevPassword2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__ApplyMigrations: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
